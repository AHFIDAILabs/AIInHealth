<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Fallback title only — every route's real title/description/OG/Twitter
         tags are owned by src/components/seo/SEO.tsx (react-helmet-async) and
         baked in per-route by scripts/prerender.mjs at build time. This
         index.html source template is only ever served as-is when
         prerendering was skipped for a deploy (see prerender.mjs's own
         comment on why it degrades gracefully instead of failing the build) —
         no static description/OG/Twitter meta tags here on purpose: Helmet
         only ever replaces <title> (a real DOM API call), it can't remove a
         hardcoded <meta> tag it didn't create, so keeping duplicates here
         previously left the STALE homepage description/OG tags first in the
         document — the one crawlers/social bots read — on every other route. -->
    <title>AI in Health Summit 2026 | Abuja, Nigeria</title>
    <link rel="icon" type="image/png" href="/summit-icon.png" />
    <link rel="apple-touch-icon" href="/pwa-icon-192.png" />

    <!-- PWA: installable "Add to Home Screen" with an offline-capable app shell —
         see public/sw.js. Purely additive: no existing request/route is touched by
         this, the service worker only ever caches same-origin static assets. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0F172A" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AIHS 2026" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-white font-body text-navy antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
