server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA routing — every unmatched path falls back to index.html so React Router
    # handles it client-side instead of nginx 404ing a real route like /agenda.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    location ~* \.(?:css|js|woff2?|png|jpe?g|svg)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
