server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA routing — every unmatched path falls back to app-shell.html (the plain,
    # un-prerendered CSR shell — see prerender.mjs) so React Router handles it
    # client-side instead of nginx 404ing a real route like /admin/dashboard.
    # Deliberately NOT index.html: scripts/prerender.mjs overwrites index.html
    # with the Homepage's own fully-rendered snapshot (for "/" requests, and for
    # real SEO value there), so falling back to it here would briefly flash
    # stale Homepage content on every /admin/* route (never prerendered — see
    # publicRoutes.mjs) and on any other unmatched path, before client-side
    # routing corrected it to the real page.
    location / {
        try_files $uri $uri/ /app-shell.html;
    }

    location = /app-shell.html {
        add_header X-Robots-Tag "noindex";
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    location ~* \.(?:css|js|woff2?|png|jpe?g|svg)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
