version: '3.9'

# Local full-stack Docker environment — an alternative to `npm run dev` in each
# package, not a production deployment manifest. Real deployment (Render, Railway,
# Fly, a VPS, etc.) uses the same two Dockerfiles but with real secrets and a real
# MongoDB Atlas URI instead of the mongo service below.
services:
  mongo:
    image: mongo:7
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db

  backend:
    build: ./backend
    ports:
      - '5000:5000'
    environment:
      NODE_ENV: development
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/ai_health_summit
      ACCESS_TOKEN_SECRET: docker-compose-dev-access-secret-change-me-32chars+
      DELEGATE_TOKEN_SECRET: docker-compose-dev-delegate-secret-change-me-32chars+
      FRONTEND_ORIGIN: http://localhost:5173
      COOKIE_DOMAIN: localhost
      # Real values — image uploads (avatar/logo pickers) return a 503 without
      # these, same as any other environment. Set them in a local .env and
      # reference via `env_file: ./backend/.env` instead if you'd rather not
      # inline real credentials here.
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
    depends_on:
      - mongo

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:5000/api/v1
    ports:
      - '5173:80'
    depends_on:
      - backend

volumes:
  mongo_data:
