version: '3.9'

# Local full-stack Docker environment — an alternative to `npm run dev` in each
# package, not a production deployment manifest. Real deployment (Render, Railway,
# Fly, a VPS, etc.) uses the same two Dockerfiles but with real secrets and a real
# MongoDB Atlas URI instead of the mongo service below.
services:
  mongo:
    image: mongo:7
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db

  backend:
    build: ./backend
    ports:
      - '5000:5000'
    environment:
      NODE_ENV: development
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/ai_health_summit
      ACCESS_TOKEN_SECRET: docker-compose-dev-access-secret-change-me-32chars+
      DELEGATE_TOKEN_SECRET: docker-compose-dev-delegate-secret-change-me-32chars+
      FRONTEND_ORIGIN: http://localhost:5173
      COOKIE_DOMAIN: localhost
    volumes:
      # Uploaded images (avatars/logos) live on local disk — persisted here for
      # Docker-based local dev. A real deploy needs this volume to survive
      # redeploys too, or a move to cloud storage (S3/Cloudinary) instead.
      - uploads_data:/app/uploads
    depends_on:
      - mongo

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:5000/api/v1
    ports:
      - '5173:80'
    depends_on:
      - backend

volumes:
  mongo_data:
  uploads_data:
