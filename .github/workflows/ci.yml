name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      # Fails the build on high/critical advisories; moderate/low are left
      # non-blocking so a new low-severity transitive advisory doesn't stall
      # every PR — still visible in the job log either way.
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # react-router-dom's fix requires the 6->7 major (a real breaking
      # migration, not something to force through a security patch) — its one
      # "high" advisory is an open-redirect via a backslash-prefixed path
      # passed to navigate()/<Link>, and this app never passes user-controlled
      # input into either (every navigate() call here uses a static route or a
      # server-built path). Tracked as an accepted risk; threshold left at
      # critical here until the v7 migration is scheduled on its own.
      - run: npm audit --audit-level=critical
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          VITE_API_URL: http://localhost:5000/api/v1
